name: Validation

# Single definition of every merge-blocking and release-blocking check.
#
# NovaShop CI calls this workflow for pull requests and feature branches, the
# NovaShop release workflow calls it before any image is published, and the
# NovaShop-GitOps pull request workflow calls it across repositories. Because
# release depends on this workflow inside one job graph, publishing can never
# race validation.

on:
  workflow_call:
    inputs:
      caller:
        description: Repository invoking this workflow (application or gitops).
        type: string
        required: false
        default: application
      app-ref:
        description: NovaShop ref to validate. Used when caller is gitops.
        type: string
        required: false
        default: main
      gitops-ref:
        description: NovaShop-GitOps ref to validate. Used when caller is application.
        type: string
        required: false
        default: main

permissions:
  contents: read

env:
  APP_REPOSITORY_SLUG: nguyenlpn2015/NovaShop
  GITOPS_REPOSITORY_SLUG: nguyenlpn2015/NovaShop-GitOps
  PYTHON_VERSION: "3.12.11"
  NODE_VERSION: "22.19.0"
  YAMLLINT_VERSION: "1.38.0"
  KUSTOMIZE_VERSION: v5.8.1
  KUSTOMIZE_SHA256: 029a7f0f4e1932c52a0476cf02a0fd855c0bb85694b82c338fc648dcb53a819d
  KUBECONFORM_VERSION: v0.7.0
  KUBECONFORM_SHA256: c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3
  # Must match terraform/.terraform-version. State written by a newer Terraform
  # cannot be read by an older one, so CI and the workstation drifting apart is a
  # problem discovered at the worst moment.
  TERRAFORM_VERSION: 1.9.8

jobs:
  backend:
    name: Backend
    if: ${{ inputs.caller == 'application' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[dev]"

      - name: Run Ruff
        run: ruff check .

      - name: Run backend tests
        run: pytest

  frontend:
    name: Frontend
    if: ${{ inputs.caller == 'application' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript checks
        run: npm run typecheck

      # Added when the frontend gained behaviour worth asserting. Until then
      # this job type-checked and built code that nothing exercised, and the
      # audit recorded "0 frontend tests" as the largest single gap.
      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  container-images:
    name: Container Images
    if: ${{ inputs.caller == 'application' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - backend
      - frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      # Build without publishing and share BuildKit layers with the release
      # workflow so the published image reuses validated layers.
      - name: Build backend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          tags: novashop-backend:ci
          cache-from: type=gha,scope=backend-ci
          cache-to: type=gha,mode=max,scope=backend-ci

      - name: Build frontend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: frontend
          file: frontend/Dockerfile
          push: false
          tags: novashop-frontend:ci
          cache-from: type=gha,scope=frontend-ci
          cache-to: type=gha,mode=max,scope=frontend-ci

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Scans dependencies, infrastructure misconfiguration, and committed
      # secrets in whichever repository invoked this workflow.
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: "1"

  # Terraform codifies the platform outside the cluster: the node, the datastores,
  # k3s, GitHub, and DNS. This job proves the configuration is well formed and
  # internally consistent.
  #
  # It runs only for the application repository, because that is where the
  # terraform/ directory lives, and it needs no credential of any kind:
  # `-backend=false` stops init reaching a backend, and `validate` never
  # configures a provider. A validation job that needed secrets could not run on a
  # fork's pull request.
  #
  # `plan` is deliberately absent here and arrives in a later phase, where it will
  # be posted for a reviewer to read. `apply` is never automated: on a single-node
  # platform where Terraform holds DNS and the cluster seed, an automatic apply is
  # a blast radius out of proportion to the convenience.
  terraform:
    name: Terraform
    if: ${{ inputs.caller == 'application' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # Formatting is not cosmetic in HCL: an unformatted file is a signal the
      # author never ran the toolchain locally, and a diff nobody can read hides
      # the change that matters.
      - name: Check formatting
        run: terraform fmt -check -recursive -diff terraform

      # Every layer is validated independently because each is a root module with
      # its own provider requirements. Iterating means a new layer is covered the
      # moment its directory exists, without editing this workflow.
      # tflint catches what fmt and validate cannot: declarations nothing uses. It found
      # twelve on its first run, every one invisible to this pipeline until now.
      #
      # It fails on errors and reports warnings without blocking, and that is a compromise
      # rather than a preference. All twelve current warnings are variables and locals
      # belonging to layers whose resources have not landed yet — real interface, not dead
      # code. Failing on them would mean deleting an interface that is about to be used, or
      # exempting the rule permanently.
      #
      # The cost is real: a warning nobody has to act on is a warning that gets ignored. The
      # count is tracked in docs/TERRAFORM_AUDIT.md with a target of zero, and the fix is to
      # land the resources, not to relax the rule. When the count reaches zero this should
      # become --minimum-failure-severity=warning.
      - name: Set up tflint
        uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1
        with:
          tflint_version: v0.55.0

      - name: Lint every layer
        run: |
          set -Eeuo pipefail
          tflint --recursive --format compact             --config "$(pwd)/.tflint.hcl"             --minimum-failure-severity=error

      - name: Validate every layer
        run: |
          set -Eeuo pipefail
          failed=0
          for layer in terraform/layers/*/; do
            printf '\n=== %s ===\n' "${layer}"
            if terraform -chdir="${layer}" init -backend=false -input=false -no-color \
              && terraform -chdir="${layer}" validate -no-color; then
              printf 'PASS %s\n' "${layer}"
            else
              printf 'FAIL %s\n' "${layer}"
              failed=$((failed + 1))
            fi
          done
          if (( failed > 0 )); then
            printf '\n%d layer(s) failed validation.\n' "${failed}" >&2
            exit 1
          fi

  platform:
    name: Platform
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # The invoking repository is always checked out at the ref under review;
      # the counterpart repository is checked out at its requested ref.
      - name: Check out application repository (application caller)
        if: ${{ inputs.caller == 'application' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: app
          fetch-depth: 0

      - name: Check out GitOps repository (application caller)
        if: ${{ inputs.caller == 'application' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.GITOPS_REPOSITORY_SLUG }}
          ref: ${{ inputs.gitops-ref }}
          path: gitops

      - name: Check out GitOps repository (gitops caller)
        if: ${{ inputs.caller == 'gitops' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gitops

      - name: Check out application repository (gitops caller)
        if: ${{ inputs.caller == 'gitops' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.APP_REPOSITORY_SLUG }}
          ref: ${{ inputs.app-ref }}
          path: app
          fetch-depth: 0

      # Revision durability is decided against the application default branch,
      # so that remote-tracking ref must exist locally.
      - name: Fetch application default branch
        run: |
          git -C app fetch --no-tags --prune origin \
            "+refs/heads/main:refs/remotes/origin/main"
          git -C app rev-parse --verify origin/main

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install yamllint
        run: python -m pip install "yamllint==${YAMLLINT_VERSION}"

      # Helm is installed with the same checksum-verifying installer used on the
      # production node, so CI and the cluster never diverge in version.
      - name: Install Helm
        run: bash app/scripts/linux/install-helm.sh

      - name: Install Kustomize and kubeconform
        run: |
          set -Eeuo pipefail
          workdir="$(mktemp -d)"
          trap 'rm -rf -- "${workdir}"' EXIT

          curl --fail --silent --show-error --location \
            --output "${workdir}/kustomize.tar.gz" \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "${KUSTOMIZE_SHA256}" "${workdir}/kustomize.tar.gz" \
            | sha256sum --check --status -

          curl --fail --silent --show-error --location \
            --output "${workdir}/kubeconform.tar.gz" \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          printf '%s  %s\n' "${KUBECONFORM_SHA256}" "${workdir}/kubeconform.tar.gz" \
            | sha256sum --check --status -

          tar --extract --gzip --file "${workdir}/kustomize.tar.gz" \
            --directory "${workdir}" kustomize
          tar --extract --gzip --file "${workdir}/kubeconform.tar.gz" \
            --directory "${workdir}" kubeconform
          sudo install -m 0755 "${workdir}/kustomize" /usr/local/bin/kustomize
          sudo install -m 0755 "${workdir}/kubeconform" /usr/local/bin/kubeconform

          kustomize version
          kubeconform -v

      - name: Validate platform desired state
        run: |
          bash app/scripts/validate-platform.sh \
            --app-dir app \
            --gitops-dir gitops \
            --scope all

      # Rendering and schema validation cannot detect a scrape job whose relabel
      # rules match nothing: it renders, validates, deploys, and collects zero
      # series while looking exactly like a healthy system. This asserts the
      # generated Prometheus configuration under promtool and checks that every
      # scrape job the platform depends on is still present by name.
      - name: Validate observability desired state
        run: bash app/scripts/validate-observability.sh --gitops-dir gitops
