name: Continuous Integration

# Pull requests and feature branches are validated here. Pushes to main are
# validated by the release workflow instead, so that publishing and validation
# always execute inside a single job graph and cannot race.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "feature/**"
      - "fix/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/validation.yml
    permissions:
      contents: read
    with:
      caller: application
      gitops-ref: main
