# Local Development Only

name: novashop

services:
  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - novashop

  # Local equivalent of the Argo CD PreSync hook. Same image, same command, so a
  # migration that works here is the one that runs in the cluster. Compose has no
  # hooks, so ordering is expressed as a completion dependency instead.
  migrate:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-novashop}:${POSTGRES_PASSWORD:-novashop}@postgres:5432/${POSTGRES_DB:-novashop}
      REDIS_URL: redis://redis:6379/0
    command: >-
      sh -c "set -e;
      alembic upgrade head;
      python -m app.db.seed"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - novashop

  backend:
    build:
      context: ./backend
    environment:
      APP_NAME: ${APP_NAME:-NovaShop API}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-novashop}:${POSTGRES_PASSWORD:-novashop}@postgres:5432/${POSTGRES_DB:-novashop}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - novashop

  postgres:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-novashop}
      POSTGRES_USER: ${POSTGRES_USER:-novashop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-novashop}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-novashop} -d ${POSTGRES_DB:-novashop}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - novashop

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - novashop

volumes:
  postgres_data:
  redis_data:

networks:
  novashop:
    driver: bridge
