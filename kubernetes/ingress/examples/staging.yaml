# Reconciled only by the Ubuntu k3s GitOps overlay.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: novashop-redirect
  namespace: novashop-staging
  labels:
    app.kubernetes.io/name: novashop
    app.kubernetes.io/component: edge
    app.kubernetes.io/part-of: novashop
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: novashop-security-headers
  namespace: novashop-staging
  labels:
    app.kubernetes.io/name: novashop
    app.kubernetes.io/component: edge
    app.kubernetes.io/part-of: novashop
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    stsPreload: false
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: strict-origin-when-cross-origin
    customResponseHeaders:
      Permissions-Policy: "camera=(), geolocation=(), microphone=(), payment=(), usb=()"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: novashop-compress
  namespace: novashop-staging
  labels:
    app.kubernetes.io/name: novashop
    app.kubernetes.io/component: edge
    app.kubernetes.io/part-of: novashop
spec:
  compress: {}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: novashop-secure-chain
  namespace: novashop-staging
  labels:
    app.kubernetes.io/name: novashop
    app.kubernetes.io/component: edge
    app.kubernetes.io/part-of: novashop
spec:
  chain:
    middlewares:
      - name: novashop-security-headers
      - name: novashop-compress
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: novashop-public-http
  namespace: novashop-staging
  labels:
    app.kubernetes.io/name: novashop
    app.kubernetes.io/instance: novashop-staging
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: novashop
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: novashop-staging-novashop-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: staging.novashop.smartdev.vn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: novashop-frontend
                port:
                  name: http
    - host: api.staging.novashop.smartdev.vn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: novashop-backend
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: novashop-public-https
  namespace: novashop-staging
  labels:
    app.kubernetes.io/name: novashop
    app.kubernetes.io/instance: novashop-staging
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: novashop
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: novashop-staging-novashop-secure-chain@kubernetescrd
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - staging.novashop.smartdev.vn
        - api.staging.novashop.smartdev.vn
      secretName: novashop-staging-tls
  rules:
    - host: staging.novashop.smartdev.vn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: novashop-frontend
                port:
                  name: http
    - host: api.staging.novashop.smartdev.vn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: novashop-backend
                port:
                  name: http
