# Phase 1 public edge: HTTP only. TLS resources are intentionally not enabled.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: novashop-http-headers
  namespace: novashop-development
  labels:
    app.kubernetes.io/name: novashop
    app.kubernetes.io/component: edge
    app.kubernetes.io/part-of: novashop
spec:
  headers:
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: strict-origin-when-cross-origin
    customResponseHeaders:
      Permissions-Policy: "camera=(), geolocation=(), microphone=(), payment=(), usb=()"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: novashop-http-compress
  namespace: novashop-development
  labels:
    app.kubernetes.io/name: novashop
    app.kubernetes.io/component: edge
    app.kubernetes.io/part-of: novashop
spec:
  compress: {}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: novashop-http-chain
  namespace: novashop-development
  labels:
    app.kubernetes.io/name: novashop
    app.kubernetes.io/component: edge
    app.kubernetes.io/part-of: novashop
spec:
  chain:
    middlewares:
      - name: novashop-http-headers
      - name: novashop-http-compress
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: novashop-public-http
  namespace: novashop-development
  labels:
    app.kubernetes.io/name: novashop
    app.kubernetes.io/instance: novashop-development
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: novashop
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: novashop-development-novashop-http-chain@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: dev.novashop.smartdev.vn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: novashop-frontend
                port:
                  name: http
    - host: api.dev.novashop.smartdev.vn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: novashop-backend
                port:
                  name: http
