# Grafana for the NovaShop platform.
#
# Published at https://grafana.novashop.smartdev.vn behind two independent
# authentication layers: Traefik basic auth at the edge, and Grafana's own admin
# login behind it. Anonymous access and sign-up are off, so neither layer alone
# grants entry.
#
# This is a demo platform. Basic auth is a deliberate floor, not a
# recommendation: it sends a reusable credential on every request and has no
# lockout, no MFA, and no per-user audit trail. A platform holding real customer
# data wants OIDC here instead, at which point the edge middleware below is
# replaced rather than extended.

replicas: 1

# Dashboards and datasources are provisioned from files in Git. Nothing is
# created through the UI, because a dashboard that exists only in the database
# is lost when the volume is lost and cannot be reviewed in a pull request.
persistence:
  enabled: true
  size: 512Mi
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

# The admin password is supplied by a Secret created outside Git, in the same
# way the runtime database credentials are. An inline password here would be
# committed in clear text.
admin:
  existingSecret: novashop-grafana-admin
  userKey: admin-user
  passwordKey: admin-password

securityContext:
  runAsNonRoot: true
  runAsUser: 472
  runAsGroup: 472
  fsGroup: 472

# The chart's init container chowns the data volume, which requires root. The
# pod security context above forbids that, so the init container failed with
# "chown: /var/lib/grafana/csv: Permission denied" and the pod crash-looped.
#
# fsGroup already makes the kubelet set group ownership on the volume at mount
# time, so the chown is redundant. Disabling it is the more secure fix: no
# container in this pod runs as root at any point.
initChownData:
  enabled: false

service:
  type: ClusterIP

# Only the websecure entrypoint is served here. Port 80 is left to cert-manager,
# which creates its own temporary Ingress for the HTTP-01 challenge; a redirect
# for humans is defined in extraObjects below.
ingress:
  enabled: true
  ingressClassName: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: observability-grafana-secure-chain@kubernetescrd
  hosts:
    - grafana.novashop.smartdev.vn
  path: /
  pathType: Prefix
  tls:
    - hosts:
        - grafana.novashop.smartdev.vn
      secretName: novashop-grafana-tls

grafana.ini:
  server:
    # Must be the published URL, not localhost. Grafana builds absolute links
    # from this: share URLs, and the "view in Grafana" link in every alert
    # notification. Left at localhost those links point at whatever the reader
    # happens to be running on port 3000.
    root_url: https://grafana.novashop.smartdev.vn/
  analytics:
    reporting_enabled: false
    check_for_updates: false
  users:
    allow_sign_up: false
  auth.anonymous:
    enabled: false
  log:
    mode: console
    level: info

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: novashop-prometheus
        access: proxy
        url: http://novashop-prometheus-server.observability.svc.cluster.local
        isDefault: true
        jsonData:
          timeInterval: 30s
      - name: Loki
        type: loki
        uid: novashop-loki
        access: proxy
        url: http://novashop-loki.observability.svc.cluster.local:3100
        jsonData:
          # Loki runs single-tenant, so no X-Scope-OrgID header is sent.
          maxLines: 1000

# Dashboards are loaded from ConfigMaps carrying the grafana_dashboard label, so
# each dashboard is a reviewable file in this repository.
sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    searchNamespace: observability
    folderAnnotation: grafana_folder
    provider:
      foldersFromFilesStructure: true
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 96Mi

testFramework:
  enabled: false

# The edge in front of Grafana. These live here rather than in a separate
# Application so that the routing and the workload it routes to are described by
# one file and move in one commit.
extraObjects:
  # Basic auth. The Secret is NOT in Git: it holds an htpasswd line, and a bcrypt
  # hash in a public repository is an offline cracking target, not a secret. It
  # is created out of band exactly like novashop-grafana-admin -- see
  # docs/operations/observability-guide.md.
  #
  # Traefik expects key `users` containing htpasswd lines. If the Secret is
  # missing, Traefik fails the router closed and returns 500 rather than serving
  # Grafana unauthenticated, which is the failure mode we want.
  - apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: grafana-basic-auth
      namespace: observability
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/component: edge
        app.kubernetes.io/part-of: novashop
    spec:
      basicAuth:
        secret: novashop-grafana-basic-auth
        realm: NovaShop Observability

  - apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: grafana-security-headers
      namespace: observability
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/component: edge
        app.kubernetes.io/part-of: novashop
    spec:
      headers:
        contentTypeNosniff: true
        referrerPolicy: strict-origin-when-cross-origin
        # frameDeny is deliberately omitted. Grafana embeds its own panels in
        # iframes, and DENY breaks panel rendering in the UI.
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        customResponseHeaders:
          Permissions-Policy: "camera=(), geolocation=(), microphone=(), payment=(), usb=()"

  - apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: grafana-secure-chain
      namespace: observability
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/component: edge
        app.kubernetes.io/part-of: novashop
    spec:
      chain:
        # Basic auth first: an unauthenticated request should be rejected before
        # any work is done on its behalf.
        middlewares:
          - name: grafana-basic-auth
          - name: grafana-security-headers

  - apiVersion: traefik.io/v1alpha1
    kind: Middleware
    metadata:
      name: grafana-https-redirect
      namespace: observability
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/component: edge
        app.kubernetes.io/part-of: novashop
    spec:
      redirectScheme:
        scheme: https
        permanent: true

  # Port 80 exists only to send humans to HTTPS. It carries no basic auth and no
  # backend of consequence: the redirect middleware answers before the service is
  # reached. cert-manager's HTTP-01 challenge is served by its own Ingress, which
  # Traefik matches on the more specific /.well-known path.
  - apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: novashop-grafana-http-redirect
      namespace: observability
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/component: ingress
        app.kubernetes.io/part-of: novashop
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: web
        traefik.ingress.kubernetes.io/router.middlewares: observability-grafana-https-redirect@kubernetescrd
    spec:
      ingressClassName: traefik
      rules:
        - host: grafana.novashop.smartdev.vn
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: novashop-grafana
                    port:
                      number: 80
