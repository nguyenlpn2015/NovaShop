apiVersion: apps/v1
kind: Deployment
metadata:
  name: novashop-frontend
  namespace: novashop
  labels:
    app.kubernetes.io/name: novashop-frontend
    app.kubernetes.io/instance: novashop
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: novashop
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: novashop-frontend
      app.kubernetes.io/instance: novashop
  template:
    metadata:
      labels:
        app.kubernetes.io/name: novashop-frontend
        app.kubernetes.io/instance: novashop
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: novashop
        app.kubernetes.io/version: "0.1.0"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          # Use an immutable Git SHA or digest for production releases.
          image: ghcr.io/nguyenlpn2015/novashop-frontend:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: novashop-config
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}
