apiVersion: apps/v1
kind: Deployment
metadata:
  name: novashop-backend
  namespace: novashop
  labels:
    app.kubernetes.io/name: novashop-backend
    app.kubernetes.io/instance: novashop
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: novashop
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: novashop-backend
      app.kubernetes.io/instance: novashop
  template:
    metadata:
      labels:
        app.kubernetes.io/name: novashop-backend
        app.kubernetes.io/instance: novashop
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: novashop
        app.kubernetes.io/version: "0.1.0"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          # Use an immutable Git SHA or digest for production releases.
          image: ghcr.io/nguyenlpn2015/novashop-backend:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: novashop-config
            - secretRef:
                name: novashop-secrets
          # TODO: Change to /live when the dedicated endpoint is available.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # TODO: Change to /ready when dependency-aware readiness is available.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
