apiVersion: v1
kind: Secret
metadata:
  name: novashop-secrets
  namespace: novashop
  labels:
    app.kubernetes.io/name: novashop
    app.kubernetes.io/instance: novashop
    app.kubernetes.io/part-of: novashop
    app.kubernetes.io/managed-by: kubectl
type: Opaque
