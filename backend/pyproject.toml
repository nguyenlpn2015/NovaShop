[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "novashop-backend"
version = "0.1.0"
description = "NovaShop backend API"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.30,<1.0",
  "fastapi>=0.115,<1.0",
  "prometheus-client>=0.21,<1.0",
  "pydantic-settings>=2.7,<3.0",
  "redis>=5.2,<6.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
# Tracing dependencies are optional so the runtime image stays small when
# tracing is off, and so an OpenTelemetry release cannot break the service.
tracing = [
  "opentelemetry-sdk>=1.29,<2.0",
  "opentelemetry-exporter-otlp-proto-http>=1.29,<2.0",
  "opentelemetry-instrumentation-fastapi>=0.50b0,<1.0",
  "opentelemetry-instrumentation-asyncpg>=0.50b0,<1.0",
  "opentelemetry-instrumentation-redis>=0.50b0,<1.0",
]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<1.0",
  "ruff>=0.9,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
