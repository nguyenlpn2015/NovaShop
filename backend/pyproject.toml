[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "novashop-backend"
version = "0.1.0"
description = "NovaShop backend API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2.0",
  "asyncpg>=0.30,<1.0",
  "fastapi>=0.115,<1.0",
  # SQLAlchemy's async support runs the sync DBAPI facade on a greenlet. It is a
  # transitive dependency, pinned explicitly because an incompatible greenlet is
  # an obscure crash at first query rather than an install-time failure.
  "greenlet>=3.1,<4.0",
  "prometheus-client>=0.21,<1.0",
  "pydantic-settings>=2.7,<3.0",
  "redis>=5.2,<6.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
# Tracing dependencies are optional so the runtime image stays small when
# tracing is off, and so an OpenTelemetry release cannot break the service.
tracing = [
  "opentelemetry-sdk>=1.29,<2.0",
  "opentelemetry-exporter-otlp-proto-http>=1.29,<2.0",
  "opentelemetry-instrumentation-fastapi>=0.50b0,<1.0",
  "opentelemetry-instrumentation-asyncpg>=0.50b0,<1.0",
  "opentelemetry-instrumentation-redis>=0.50b0,<1.0",
]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<1.0",
  "pytest-cov>=6.0,<8.0",
  "ruff>=0.9,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
# Coverage is deliberately not in addopts. Putting --cov here would make every
# local `pytest` invocation require pytest-cov, so a contributor with an older
# virtualenv gets an unrecognised-argument error instead of a test run. CI asks
# for coverage explicitly; see .github/workflows/validation.yml.
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
  # Import-time wiring with no branching worth measuring: covering it would
  # raise the number without telling anyone anything.
  "app/__init__.py",
  "app/db/seed.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
# No fail_under. The number is published, not enforced. A threshold invites
# tests written to move a percentage rather than to catch a defect, and this
# suite is small enough that one file can swing it several points.
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Depends() and Query() in a parameter default is the FastAPI idiom, not the
# mutable-default bug B008 exists to catch. Both are evaluated once at import
# and are immutable descriptors.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
