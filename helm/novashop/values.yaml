namespace:
  create: true
  name: novashop

commonLabels: {}

config:
  appName: NovaShop API
  appVersion: "0.1.0"
  environment: production
  # In-cluster Service address. The frontend fetches server-side, so this is
  # never sent to a browser and does not vary by public hostname.
  backendUrl: http://novashop-backend

# The Secret must be created out-of-band by a secrets manager or CI/CD.
secrets:
  existingSecret: novashop-secrets

# Schema migration and demo data, run as an Argo CD PreSync hook.
#
# Not at application startup. Startup migration with more than one replica means
# concurrent writers racing for the same DDL, and a failure part-way leaves some
# replicas migrated and some not, with no single place to read what happened. A
# PreSync Job runs exactly once and blocks the sync when it fails.
migrations:
  enabled: true

  # Seeding is idempotent -- rows are matched on their natural key and inserted
  # only if absent -- so running it on every sync is a no-op after the first.
  # It is on in every environment on purpose: this application exists to be
  # demonstrated, and an empty catalogue demonstrates nothing.
  seed: true

  # One retry. A migration that fails twice is failing for a reason retrying
  # will not fix, and each attempt delays the sync.
  backoffLimit: 1
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 384Mi

# Ingress default-deny per namespace, with explicit exceptions.
#
# Enforcement was proven on this cluster before the templates were written: k3s runs
# kube-router's netpol controller, and a deny-all took a probe pod from REACHABLE to
# BLOCKED. Shipping policies onto a cluster that ignores them would be worse than shipping
# none, because `kubectl get networkpolicy` would then imply protection that does not exist.
networkPolicy:
  enabled: true

  # Admitted for kubelet probes. Readiness and liveness checks come from the node, not from
  # a pod, so a namespace-only rule takes every replica NotReady the moment it applies —
  # and with no ready endpoint Traefik returns 503. Scoped to the node network rather than
  # left open.
  nodeNetwork: 10.10.1.0/24

  # Prometheus scrapes the backend's container port from here.
  observabilityNamespace: observability

backend:
  replicaCount: 2
  revisionHistoryLimit: 5
  image:
    repository: ghcr.io/nguyenlpn2015/novashop-backend
    tag: latest
    digest: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 8000
  strategy:
    maxSurge: 1
    maxUnavailable: 0
  probes:
    liveness:
      # Reports only that the process can serve. It must never consult a
      # datastore: a failing liveness probe restarts the container, and a
      # restart cannot fix a datastore outage.
      path: /live
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    readiness:
      # Verifies PostgreSQL and Redis on every call. Failing removes the replica
      # from the Service endpoints without restarting it. The endpoint bounds
      # each check at 2s, inside the 3s probe timeout, so an unreachable
      # dependency is reported rather than timing the probe out.
      path: /ready
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

frontend:
  replicaCount: 2
  revisionHistoryLimit: 5
  image:
    repository: ghcr.io/nguyenlpn2015/novashop-frontend
    tag: latest
    digest: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 3000
  strategy:
    maxSurge: 1
    maxUnavailable: 0
  probes:
    liveness:
      # /healthz, not /. The home page fetches the catalogue during server
      # rendering, so probing / makes liveness depend on the backend -- and a
      # failing liveness probe restarts the container. A backend outage would
      # then restart every frontend replica, removing the one thing still able
      # to serve an error page. /healthz answers from the Node process alone.
      path: /healthz
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    readiness:
      path: /healthz
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
  frontendHost: novashop.local
  backendHost: api.novashop.local
  tls:
    enabled: false
    secretName: novashop-tls
