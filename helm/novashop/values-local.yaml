# Docker Desktop Kubernetes. Applied by scripts/deploy-local-k8s.ps1.
#
# The differences from the node are all consequences of one thing: there is no
# public DNS, so there is no certificate, so there is no TLS.

namespace:
  create: false

config:
  environment: local
  # In-cluster Service. The frontend fetches on the server, so this address is
  # never sent to a browser.
  backendUrl: http://novashop-backend

# One replica each. Two would prove nothing locally and doubles the memory a
# laptop spends on a demonstration.
backend:
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

frontend:
  replicaCount: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Off. The rules admit the node network for kubelet probes, and Docker Desktop's
# node network is not 10.10.1.0/24 -- enabling them here would take every replica
# NotReady for a reason that has nothing to do with the policies being wrong.
networkPolicy:
  enabled: false

migrations:
  enabled: true
  seed: true

ingress:
  enabled: true
  className: traefik
  annotations: {}
  # *.localhost, which resolves to 127.0.0.1 with no hosts file and no
  # administrator. Windows, macOS and Linux resolvers all do this; RFC 6761
  # reserves the name for exactly this purpose.
  #
  # Two earlier attempts were worse. dev.novashop.local collided with the
  # novashop-development namespace left by the earlier Docker Desktop work --
  # and two Ingresses claiming one host is not an error, so Traefik picked one
  # and the other returned 404 from a namespace that looked entirely healthy.
  # novashop.local avoided the collision but needed an elevated PowerShell to
  # edit the hosts file, which is a poor first step for someone who just wants
  # to see the application run.
  #
  # A wildcard DNS service such as nip.io would also have worked and was
  # rejected: it puts an internet dependency in the middle of a local
  # deployment, and this repository does not have those anywhere else.
  frontendHost: novashop.localhost
  backendHost: api.novashop.localhost
  tls:
    enabled: false
